<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Zen API Docs</title>
    <style>
      body {
        margin: 0;
      }
      .zen-header {
        position: sticky;
        top: 0;
        z-index: 100;
        background: #1b1b1b;
        padding: 13px 20px;
      }
      .zen-header-content {
        display: flex;
        align-items: center;
        gap: 7px;
      }
      .zen-logo {
        width: 23px;
        height: 23px;
        display: block;
      }
      .zen-title {
        color: #fff;
        font-weight: 700;
        font-size: 1.2em;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      .zen-version {
        color: rgba(255, 255, 255, 0.35);
        font-size: 0.8em;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        margin-left: 4px;
      }
      .zen-docs-link {
        margin-left: auto;
        color: #999;
        font-size: 0.9em;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        text-decoration: none;
        padding: 4px 10px;
        border-radius: 6px;
        transition:
          background 0.15s,
          color 0.15s;
        display: flex;
        align-items: center;
        gap: 5px;
      }
      .zen-docs-link:hover {
        background: rgba(255, 255, 255, 0.1);
        color: #fff;
      }
      .zen-docs-link svg {
        width: 14px;
        height: 14px;
        fill: none;
        stroke: currentColor;
        stroke-width: 2;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .zen-docs-link:hover {
        background: rgba(255, 255, 255, 0.1);
        color: #fff;
      }
      /* Scalar native offset. */
      :root {
        --scalar-custom-header-height: 52px;
      }
    </style>
  </head>

  <body>
    <header class="zen-header">
      <div class="zen-header-content">
        <img src="/openapi/ui/logo.svg" alt="" class="zen-logo" />
        <div>
          <span class="zen-title">Zen</span>
          <span class="zen-version">v%[2]s</span>
        </div>

        <a
          href="https://zen-docs-steel.vercel.app/"
          class="zen-docs-link"
          target="_blank"
        >
          <svg viewBox="0 0 24 24">
            <line x1="7" y1="17" x2="17" y2="7" />
            <polyline points="7 7 17 7 17 17" />
          </svg>
          Docs
        </a>
      </div>
    </header>

    <div id="zen-api-reference"></div>
    <script src="/openapi/ui/scalar.js"></script>
    <script>
      Scalar.createApiReference("#zen-api-reference", {
        url: "%[1]s",
        // ui-extra-options
      });
    </script>
  </body>
</html>
